<script>

function addProduct(){
 let g=document.createElement("div");
 g.className="product-group";
 g.innerHTML='<div class="product-row"><input class="product-name" placeholder="제품명 (예: n.any2)"><button class="remove" onclick="this.closest(\'.product-group\').remove();updatePreview()">−</button></div><div class="spec-list"></div><button class="add-spec" onclick="addSpec(this)">＋ 형명 추가</button>';
 productGroups.appendChild(g);
 addSpec(g.querySelector(".add-spec"));
 updatePreview();
}
function addSpec(b){
 let r=document.createElement("div");
 r.className="spec-row";
 r.innerHTML='<input class="spec-name" placeholder="형명 / 규격 (예: 6.5x45)"><input class="spec-qty" type="number" min="1" placeholder="수량"><button class="remove" onclick="this.parentElement.remove();updatePreview()">−</button>';
 b.closest(".product-group").querySelector(".spec-list").appendChild(r);
 updatePreview();
}
function buildItems(){
 let a=[];
 document.querySelectorAll(".product-group").forEach(g=>{
  const p=g.querySelector(".product-name").value.trim();
  const rows=[...g.querySelectorAll(".spec-row")];
  const hasSpec=rows.some(r=>r.querySelector(".spec-name").value.trim()!=="");

  if(hasSpec){
   if(p)a.push(p);
   rows.forEach(r=>{
    const spec=r.querySelector(".spec-name").value.trim();
    const qty=r.querySelector(".spec-qty").value.trim();
    if(spec)a.push("- "+spec+(qty?" "+qty+"ea":""));
   });
  }else if(p){
   // 형명은 비어 있고 기존 수량칸에만 값이 있으면 제품명 옆에 수량 출력
   const qtyRow=rows.find(r=>(r.querySelector(".spec-qty").value||"").trim()!=="");
   const qty=qtyRow ? qtyRow.querySelector(".spec-qty").value.trim() : "";
   a.push(p+(qty?" "+qty+"ea":""));
  }
 });
 return a;
}
function formatPatient(){
 const name=patient.value.trim();
 const no=patientNo.value.trim();
 const sex=patientSex.value;
 const age=patientAge.value.trim();
 let out=name;
 if(no) out+=(out?" ":"")+"#"+no;
 if(sex && age) out+=(out?" ":"")+sex+"/"+age;
 return out;
}
function getText(){
 const lines=[
  `① OP일자 : ${date.value ? (Number(date.value.slice(5,7))+"/"+Number(date.value.slice(8,10))) : ""}`,
  `② 병원명 : ${hospital.value.trim()}`,
  `③ 진료과 : ${dept.value}`,
  `④ 의사명 : ${doctor.value.trim()}`,
  "⑤ 형명 및 수량 :",
  ...buildItems(),
  `⑥ 환자 : ${formatPatient()}`
 ];
 if(landing.value===""){
  lines.push(`⑦ 특이사항 : ${note.value.trim()}`);
 }else{
  lines.push(`⑦ ${landing.value}`);
  lines.push(`⑧ 특이사항 : ${note.value.trim()}`);
 }
 return lines.join("\n");
}
function updatePreview(){preview.textContent=getText()}

let toastTimer=null;
function showNyangToast(message){
 const toast=document.getElementById("nyangToast");
 toast.textContent=message;
 toast.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>toast.classList.remove("show"),900);
}
function legacyCopy(text){
 const area=document.createElement("textarea");
 area.value=text;
 area.style.position="fixed";
 area.style.opacity="0";
 document.body.appendChild(area);
 area.focus();

}
async function shareForm(){

   showNyangToast("공유했다냥!");

  }catch(e){
   if(e && e.name==="AbortError") return;

 }
 let copied=false;

<script id="mobile-next-navigation-v17">
(function () {
  function applyHints(root=document) {
    root.querySelectorAll('.product-name, .spec-name, .spec-qty, #patient, #patientNo, #patientAge').forEach(input => {
      input.setAttribute('enterkeyhint', 'next');
    });
  }

  function groups() {
    return [...document.querySelectorAll('.product-group')];
  }

  function focusNext(input) {
    const group = input.closest('.product-group');
    if (!group) return;

    // 제품명 -> 첫 형명
    if (input.classList.contains('product-name')) {
      const target = group.querySelector('.spec-name');
      if (target) target.focus();
      return;
    }

    // 형명 -> 같은 줄 수량
    if (input.classList.contains('spec-name')) {
      const target = input.closest('.spec-row')?.querySelector('.spec-qty');
      if (target) target.focus();
      return;
    }

    // 수량
    if (input.classList.contains('spec-qty')) {
      const row = input.closest('.spec-row');
      const rows = [...group.querySelectorAll('.spec-row')];
      const idx = rows.indexOf(row);

      // 같은 제품의 다음 형명이 있으면 그쪽으로
      if (idx >= 0 && idx < rows.length - 1) {
        rows[idx + 1].querySelector('.spec-name')?.focus();
        return;
      }

      // 현재 제품의 마지막 수량 -> 다음 제품명이 있으면 다음 제품명
      const allGroups = groups();
      const gi = allGroups.indexOf(group);
      if (gi >= 0 && gi < allGroups.length - 1) {
        allGroups[gi + 1].querySelector('.product-name')?.focus();
        return;
      }

      // 마지막 제품의 마지막 수량 -> 6번 환자명
      const patient = document.querySelector('#patient');
      if (patient) patient.focus();
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    const input = e.target;
    if (!(input instanceof HTMLInputElement)) return;

    if (
      input.classList.contains('product-name') ||
      input.classList.contains('spec-name') ||
      input.classList.contains('spec-qty')
    ) {
      e.preventDefault();
      focusNext(input);
    }
  }, true);

  document.addEventListener('DOMContentLoaded', function() {
    applyHints();
    new MutationObserver(() => applyHints()).observe(
      document.getElementById('productGroups') || document.body,
      {childList:true, subtree:true}
    );
  });
})();
</script>


<script id="patient-navigation-v22">

  [patient,patientNo,patientAge].forEach(x=>x&&x.setAttribute("enterkeyhint","next"));

    else if(e.target===patientAge){e.preventDefault();note?.focus();}
  },true);
});
